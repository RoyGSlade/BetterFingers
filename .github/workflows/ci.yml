# Required CI on every pull request and push (review finding #13).
#
# The full Python suite previously ran only in the manually-triggered installer
# workflow, and the Electron e2e only when app/**, server.py, or
# requirements.txt changed — so edits to recordings.py, history_store.py,
# model_manager.py, llm_engine.py, transcriber.py, injector.py, etc. shipped
# with no tests run at all. This workflow closes that gap; expensive packaging
# stays path-filtered where it already lives.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    # Cross-platform Python test matrix (review finding: P1 CI matrix).
    # Linux runs the shipped 3.12 runtime and Windows runs the shipped 3.13
    # runtime. BetterFingers supports Windows + Linux; macOS is intentionally
    # outside the required product matrix. The packaged-app smoke on a real
    # Windows runner (with signing) is a separate manual follow-up — see
    # build-installer.yml — this job exercises the Python unit suite.
    name: python-tests (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            runtime_lock: requirements-linux-cpu.lock
            dev_lock: requirements-dev.lock
          - os: windows-latest
            python-version: "3.13" # matches packaged build (build-installer.yml)
            runtime_lock: requirements-win.lock
            dev_lock: requirements-dev-win.lock
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PortAudio (Linux)
        # The sounddevice wheel bundles PortAudio on Windows/macOS but not on
        # Linux; without the system lib, importing sounddevice raises OSError
        # and kills collection of test_audio_gate / test_auto_stop_silence /
        # test_recorder_device.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        # Hashed per-platform locks are the CI/release contract. Linux uses the
        # CPU lock because the shipped Linux runtime is CPU/Vulkan, while the
        # Windows lock matches the packaged Python 3.13 backend.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r ${{ matrix.runtime_lock }}
          python -m pip install --require-hashes -r ${{ matrix.dev_lock }}

      - name: Run Python test suite
        run: python -m pytest -q tests

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify Node version pin
        # Node is pinned to major 24 across every workflow; fail loudly if the
        # runner drifts so the packaged build's toolchain stays reproducible.
        run: |
          node -v
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" != "24" ]; then
            echo "::error::Expected Node 24.x, got $(node -v)"
            exit 1
          fi

      - name: Install app dependencies
        # `npm ci` fails if package.json and package-lock.json disagree, so this
        # already enforces that the lockfile is committed and in sync.
        working-directory: app
        run: npm ci

      - name: Verify Electron toolchain is lock-pinned
        # Guards against an unpinned Electron/electron-builder/electron-vite
        # sneaking in: assert each resolves to a concrete version in the lock.
        working-directory: app
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const pkgs = lock.packages || {};
            for (const dep of ["electron", "electron-builder", "electron-vite"]) {
              const entry = pkgs["node_modules/" + dep];
              if (!entry || !entry.version) {
                console.error("::error::" + dep + " is not pinned in package-lock.json");
                process.exit(1);
              }
              console.log(dep + " -> " + entry.version);
            }
          '

      - name: Build renderer + main
        working-directory: app
        run: npm run build

      - name: Renderer/main unit tests
        working-directory: app
        run: npm run test:unit

      - name: Syntax-check main-process sources
        working-directory: app
        run: |
          for f in src/main/*.js src/preload/*.js; do
            node --check "$f"
          done

  electron-smoke:
    # Model-free Electron smoke on every PR — the full screenshot suite stays
    # in e2e-screenshots.yml. Ubuntu 24.04 needs the AppArmor userns sysctl
    # for Electron's sandbox.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        # The Linux smoke uses the same hashed runtime + dev locks as the
        # shipped AppImage; no source requirements are resolved in CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-linux-cpu.lock
          python -m pip install --require-hashes -r requirements-dev.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright browsers + OS deps
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Allow unprivileged user namespaces (Electron sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Electron app
        working-directory: app
        run: npm run build

      - name: Run model-free Electron smoke suite
        working-directory: app
        env:
          BETTERFINGERS_PYTHON: python
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npx playwright test tests/electron-smoke.spec.js

      # REDACTION GUARD: these logs/screenshots may capture transcribed text or
      # window titles. The app redacts sensitive strings server-side via
      # log_redaction.py before they hit disk; do NOT add raw stdout dumps or
      # unredacted app logs to this artifact path. Keep uploads scoped to
      # Playwright's own output. If richer app-log capture is added later, route
      # it through log_redaction.py first (server-side concern, not this file).
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electron-smoke-failures
          path: |
            app/test-results/**
            app/playwright-report/**
          if-no-files-found: ignore

  qa:
    # Full deterministic production QA board on every PR. This is separate
    # from the smaller Electron smoke so the required check proves the
    # complete scenario registry, not only the boot path.
    name: qa (production board)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright browsers + OS deps
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Allow unprivileged user namespaces (Electron sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Electron app
        working-directory: app
        run: npm run build

      - name: Run complete production QA board
        working-directory: app
        env:
          BETTERFINGERS_DATA_DIR: ${{ runner.temp }}/betterfingers-qa-data
          BF_QA_USER_DATA_DIR: ${{ runner.temp }}/betterfingers-qa-user
        run: |
          set -euo pipefail
          mkdir -p "$BETTERFINGERS_DATA_DIR" "$BF_QA_USER_DATA_DIR"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run qa:screens

  electron-smoke-crossplatform:
    # Required model-free Electron smoke on Windows. The hosted Windows runner
    # has a real display (no Xvfb needed), but packaged-app smoke with signing
    # is a separate manual follow-up.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13" # matches packaged build (build-installer.yml)
          cache: pip

      - name: Install Python dependencies
        # The Windows smoke uses the same hashed runtime + dev locks as the
        # packaged installer; no source requirements are resolved in CI.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-win.lock
          python -m pip install --require-hashes -r requirements-dev-win.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install chromium

      - name: Build Electron app
        working-directory: app
        run: npm run build

      - name: Run model-free Electron smoke suite
        working-directory: app
        env:
          BETTERFINGERS_PYTHON: python
        run: npx playwright test tests/electron-smoke.spec.js

      # REDACTION GUARD: see the Linux electron-smoke job above — keep this
      # artifact scoped to Playwright output; unredacted app logs must go
      # through log_redaction.py (server-side) before upload.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: electron-smoke-crossplatform-${{ matrix.os }}
          path: |
            app/test-results/**
            app/playwright-report/**
          if-no-files-found: ignore

  ruff:
    # Report-only lint gate (PUBLISH_PLAN C-5a). continue-on-error keeps this
    # from failing the build until the baseline is clean or triaged in
    # QA_NOTES.md; the finding count is still visible in this job's log and
    # in the uploaded artifact.
    name: ruff check (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . --output-format=full | tee ruff-report.txt

      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ruff-report
          path: ruff-report.txt
          if-no-files-found: ignore

  bandit:
    # Required medium/high security gate on the Python backend (PUBLISH_PLAN
    # C-5b). The triaged low-severity baseline remains visible in the report,
    # while -ll makes any medium/high finding fail this job.
    # Scoped to the actual server code (root *.py + backend/), not the test
    # suite or vendored/tooling scripts.
    name: bandit (medium/high required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: bandit scan
        run: bandit -ll -c .bandit -r backend *.py -f txt -o bandit-report.txt
      - name: Print bandit report
        if: always()
        run: cat bandit-report.txt

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore

  npm-audit:
    # Required production dependency-vulnerability gate (PUBLISH_PLAN C-5c).
    # --omit=dev matches what actually ships; needs only the committed
    # lockfile, so no `npm ci`/`npm install` step. The accepted baseline is
    # zero production vulnerabilities, so any future finding blocks CI.
    name: npm audit (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: npm audit
        working-directory: app
        run: |
          set -o pipefail
          npm audit --omit=dev | tee npm-audit-report.txt

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-audit-report
          path: app/npm-audit-report.txt
          if-no-files-found: ignore
