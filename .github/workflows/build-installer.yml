name: build-installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-python-tests:
    name: windows-python-tests (chunk ${{ matrix.chunk }})
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          $versionFile = (Get-Content -Raw VERSION).Trim()
          if ($version -ne $versionFile) {
            throw "Package version '$version' does not match VERSION '$versionFile'."
          }
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag '${{ github.ref_name }}' does not match package version; expected '$expectedTag'."
          }

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-win.lock
          python -m pip install --require-hashes -r requirements-dev-win.lock

      - name: Run isolated Windows test files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $testFiles = @(Get-ChildItem -Path tests -Filter "test_*.py" -File | Sort-Object FullName)
          if ($testFiles.Count -eq 0) { throw "No Python test files found." }
          $chunkCount = 8
          $chunkSize = [Math]::Ceiling($testFiles.Count / $chunkCount)
          $chunkIndex = ${{ matrix.chunk }}
          $start = $chunkIndex * $chunkSize
          if ($start -ge $testFiles.Count) { throw "Chunk $chunkIndex has no test files." }
          $end = [Math]::Min($start + $chunkSize - 1, $testFiles.Count - 1)
          $chunk = @($testFiles[$start..$end])
          Remove-Item -Path build/pytest.log -ErrorAction SilentlyContinue
          Write-Host "Running Python test files $($start + 1)-$($end + 1) of $($testFiles.Count)"
          foreach ($testFile in $chunk) {
            Write-Host "Running $($testFile.Name) in a fresh Python process"
            $stdoutPath = Join-Path $env:RUNNER_TEMP "pytest-$chunkIndex-$($testFile.BaseName).stdout.log"
            $stderrPath = Join-Path $env:RUNNER_TEMP "pytest-$chunkIndex-$($testFile.BaseName).stderr.log"
            $process = Start-Process -FilePath (Get-Command python).Source `
              -ArgumentList @("-m", "pytest", "-q", $testFile.FullName, "-W", "default") `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            if (-not $process.WaitForExit(300000)) {
              $process.Kill($true)
              $process.WaitForExit()
              Get-Content $stdoutPath -ErrorAction SilentlyContinue | Tee-Object -FilePath build/pytest.log -Append
              Get-Content $stderrPath -ErrorAction SilentlyContinue | Tee-Object -FilePath build/pytest.log -Append
              throw "$($testFile.Name) exceeded the 5-minute per-file timeout."
            }
            $process.WaitForExit()
            Get-Content $stdoutPath -ErrorAction SilentlyContinue | Tee-Object -FilePath build/pytest.log -Append
            Get-Content $stderrPath -ErrorAction SilentlyContinue | Tee-Object -FilePath build/pytest.log -Append
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
          python tools/check_project_deprecations.py build/pytest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-installer:
    needs: windows-python-tests
    runs-on: windows-latest
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance (OIDC)
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        # GitHub-hosted Windows runners provide Git Bash. Explicit fail-fast
        # keeps a resolver failure from being masked by a later pip command.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-win.lock
          python -m pip install --require-hashes -r requirements-dev-win.lock

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run app unit tests
        working-directory: app
        run: npm run test:unit

      - name: Run smoke suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -m pytest -q tests -m smoke -W default 2>&1 | Tee-Object -FilePath build/pytest-smoke.log
          if ($LASTEXITCODE -eq 5) {
            Write-Error "Smoke suite collected zero tests -- the smoke marker wiring is broken (see SMOKE_FILES in tests/conftest.py)."
            exit 1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Prefer the provisioned Azure Artifact Signing account (called Azure
      # Trusted Signing by this electron-builder integration). Until its
      # certificate profile, certificate subject and service-principal secrets
      # are all configured, alpha/manual runs remain explicitly unsigned. A
      # legacy PFX remains a supported fallback; partial configuration of
      # either mode fails instead of silently producing the wrong artifact.
      - name: Configure Windows code signing
        id: signing
        shell: powershell
        env:
          AZURE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CERT_B64: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          $azureValues = @($env:AZURE_PROFILE, $env:AZURE_PUBLISHER, $env:AZURE_TENANT, $env:AZURE_CLIENT, $env:AZURE_SECRET)
          $azureCount = @($azureValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($azureCount -gt 0 -and $azureCount -ne $azureValues.Count) {
            throw "Azure signing is partially configured. Set the certificate profile, publisher subject, tenant ID, client ID, and client secret together."
          }
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:CERT_B64)
          $hasPfxPassword = -not [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)
          if ($hasPfx -ne $hasPfxPassword) {
            throw "PFX signing is partially configured. Set WIN_CERTIFICATE_BASE64 and WIN_CERTIFICATE_PASSWORD together."
          }

          if ($azureCount -eq $azureValues.Count) {
            if ($hasPfx) {
              throw "Azure and PFX signing are both configured; choose exactly one signing authority."
            }
            "configured=true" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            "mode=azure" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            Write-Host "Azure Artifact Signing is configured for account better-fingers."
          } elseif ($hasPfx) {
            $certPath = Join-Path $env:RUNNER_TEMP "betterfingers-signing.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))
            "configured=true" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            "mode=pfx" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            "cert_path=$certPath" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
          } else {
            Write-Host "No complete Azure or PFX signing configuration; building an explicitly unsigned alpha."
            "configured=false" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            "mode=unsigned" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
          }

      # Runs electron-vite build + the PyInstaller backend bundle + electron-builder's
      # NSIS packaging in one step. Output lands in app/release/ (see
      # directories.output in app/package.json).
      - name: Build installer (electron-builder)
        working-directory: app
        env:
          BETTERFINGERS_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CSC_LINK: ${{ steps.signing.outputs.cert_path }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: npm run dist:win

      - name: Clean up code-signing certificate
        if: always() && steps.signing.outputs.mode == 'pfx'
        shell: powershell
        run: Remove-Item -LiteralPath "${{ steps.signing.outputs.cert_path }}" -ErrorAction SilentlyContinue

      - name: Enforce payload size budget
        shell: powershell
        run: |
          $payloadDir = "app\release\win-unpacked"
          if (-not (Test-Path $payloadDir)) {
            throw "electron-builder output not found at $payloadDir"
          }
          $sizeBytes = (Get-ChildItem $payloadDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $sizeMb = [math]::Round($sizeBytes / 1MB, 2)
          Write-Host "Packaged app size: $sizeMb MB"
          $limitMb = 2500
          if ($sizeMb -gt $limitMb) {
            throw "Payload size $sizeMb MB exceeds budget $limitMb MB"
          }
          Write-Host "Top 15 largest files:"
          Get-ChildItem $payloadDir -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 15 FullName, @{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Locate installer artifact
        id: installer
        shell: powershell
        run: |
          $version = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
          $expectedName = "BetterFingers-Setup-$version-x64.exe"
          $expectedPath = Join-Path "app\release" $expectedName
          if (-not (Test-Path -LiteralPath $expectedPath -PathType Leaf)) {
            throw "Expected installer not found: $expectedPath"
          }
          $installer = Get-Item -LiteralPath $expectedPath
          Write-Host "Found installer: $($installer.FullName)"
          "path=$($installer.FullName)" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT

      - name: Verify installer signature status
        shell: powershell
        env:
          AZURE_EXPECTED_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $installer = "${{ steps.installer.outputs.path }}"
          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Authenticode status: $($signature.Status)"
          if ("${{ steps.signing.outputs.configured }}" -eq "true") {
            if ($signature.Status -ne "Valid") {
              throw "Signing was configured, but Authenticode verification returned $($signature.Status)."
            }
            $signerSubject = [string]$signature.SignerCertificate.Subject
            if ("${{ steps.signing.outputs.mode }}" -eq "azure" -and $signerSubject -cne $env:AZURE_EXPECTED_PUBLISHER) {
              throw "Azure signer subject was '$signerSubject'; expected exactly '$env:AZURE_EXPECTED_PUBLISHER'."
            }
            "signed via ${{ steps.signing.outputs.mode }}; authenticode_status=$($signature.Status); signer_subject=$signerSubject" | Out-File -Encoding ascii "$installer.signature.txt"
          } else {
            if ($signature.Status -ne "NotSigned") {
              throw "Signing was not configured, but Authenticode returned $($signature.Status); expected exactly NotSigned."
            }
            $releaseVersion = (Get-Content -Raw app/package.json | ConvertFrom-Json).version
            $precedenceVersion = ($releaseVersion -split '\+', 2)[0]
            if ("${{ github.ref_type }}" -eq "tag" -and $precedenceVersion -notmatch '-') {
              throw "Stable Windows tags must be signed. Unsigned builds are allowed only for prerelease tags or manual qualification runs."
            }
            Write-Host "UNSIGNED ALPHA: no Windows signing certificate was configured."
            "unsigned alpha; authenticode_status=$($signature.Status)" | Out-File -Encoding ascii "$installer.signature.txt"
          }

      - name: Download previous release installer (replacement continuity coverage)
        id: previous
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # Optional replacement/continuity coverage: on the very first
          # release there is no prior installer, so an empty release history
          # skips this leg without weakening the build job.
          $releaseJson = gh release list --limit 1 --exclude-drafts --json tagName 2>$null
          $listExitCode = $LASTEXITCODE
          if ($listExitCode -ne 0) {
            throw "gh release list failed with exit code $listExitCode; refusing to misreport the release as having no prior installer."
          }
          $prevTag = ""
          if ($releaseJson) {
            $prevTag = $releaseJson |
              ConvertFrom-Json |
              ForEach-Object { $_.tagName } |
              Select-Object -First 1
          }
          if (-not $prevTag) {
            Write-Host "No previous release found; skipping replacement/continuity coverage."
            "path=" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Previous release: $prevTag"
          $assetJson = gh release view $prevTag --json assets 2>$null
          $assetExitCode = $LASTEXITCODE
          if ($assetExitCode -ne 0) {
            throw "gh release view failed with exit code $assetExitCode; refusing to misreport the previous release as having no installer asset."
          }
          $assets = @($assetJson | ConvertFrom-Json).assets
          $prevAssetName = $assets |
            Where-Object { $_.name -like "BetterFingers-Setup-*-x64.exe" } |
            Sort-Object name |
            Select-Object -ExpandProperty name -First 1
          if (-not $prevAssetName) {
            Write-Host "Previous release had no .exe asset; skipping replacement/continuity coverage."
            "path=" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Selected previous installer asset: $prevAssetName"
          New-Item -ItemType Directory -Force -Path prev-release | Out-Null
          gh release download $prevTag --pattern $prevAssetName --dir prev-release --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prevExe = Join-Path "prev-release" $prevAssetName
          if (-not (Test-Path -LiteralPath $prevExe -PathType Leaf)) {
            throw "Selected previous installer asset was not downloaded: $prevExe"
          }
          "path=$((Resolve-Path -LiteralPath $prevExe).Path)" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_OUTPUT

      - name: Smoke check installer install/replacement/uninstall
        shell: powershell
        env:
          AZURE_EXPECTED_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          $args = @("-InstallerPath", "${{ steps.installer.outputs.path }}")
          $args += @("-ExpectedVersion", ((Get-Content -Raw app/package.json | ConvertFrom-Json).version))
          $expectedSignature = if ("${{ steps.signing.outputs.configured }}" -eq "true") { "Valid" } else { "NotSigned" }
          $args += @("-ExpectedSignatureStatus", $expectedSignature)
          if ("${{ steps.signing.outputs.mode }}" -eq "azure") {
            $args += @("-ExpectedSignerSubject", $env:AZURE_EXPECTED_PUBLISHER)
          }
          if ("${{ steps.previous.outputs.path }}" -ne "") {
            $args += @("-PreviousInstallerPath", "${{ steps.previous.outputs.path }}")
          }
          powershell -ExecutionPolicy Bypass -File tools/smoke_installer.ps1 @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "${{ steps.installer.outputs.path }}"
          $checksumPath = "$installer.sha256"
          $expectedHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$expectedHash  $(Split-Path -Leaf $installer)" | Out-File -Encoding ascii $checksumPath

          # Parse the just-written sidecar and compare it to a fresh hash. This
          # catches malformed, mismatched, or accidentally stale release data
          # before the checksum is uploaded or published.
          $checksumLine = (Get-Content -Path $checksumPath -Raw).Trim()
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s+\*?(.+)$') {
            throw "Checksum sidecar is malformed: $checksumPath"
          }
          $sidecarHash = $Matches[1].ToLowerInvariant()
          $sidecarName = $Matches[2].Trim()
          if ($sidecarName -ne (Split-Path -Leaf $installer)) {
            throw "Checksum sidecar names '$sidecarName' instead of the installer filename."
          }
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sidecarHash -ne $actualHash) {
            throw "Checksum mismatch: sidecar=$sidecarHash actual=$actualHash"
          }
          Write-Host "Verified SHA256 sidecar for $(Split-Path -Leaf $installer): $actualHash"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ steps.installer.outputs.path }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: BetterFingers-Installer
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sha256
            ${{ steps.installer.outputs.path }}.signature.txt
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-24.04 # needs the AppArmor userns sysctl for Electron's sandbox
    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance (OIDC)
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # 3.12, NOT 3.13 like the Windows leg: the Linux build ships FULL
          # kokoro (requirements-linux.lock pins misaki==0.9.4, kokoro's G2P
          # engine, which requires Python <3.13). Windows ships kokoro-onnx and
          # runs 3.13. requirements-linux.lock + requirements-dev.lock are both
          # generated on 3.12, so the AppImage's bundled interpreter matches.
          # Verified locally: the AppImage builds and its bundled backend starts
          # on 3.12; 3.13 fails at `pip install` with "No matching distribution
          # for misaki==0.9.4".
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        # CPU lock, NOT requirements-linux.lock: the CUDA lock bundles ~3.9 GB
        # of nvidia/CUDA torch libs into the PyInstaller backend, which (a) the
        # shipped AppImage never uses — Linux inference is CPU/Vulkan, friends
        # have no NVIDIA GPU — and (b) overflowed the runner's disk (ENOSPC) as
        # electron-builder copies the bundle through multiple staging dirs. The
        # CPU lock pins torch==2.13.0+cpu; verified locally that the AppImage
        # builds (~546 MB, not ~4 GB) and its backend runs identically.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-linux-cpu.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run app unit tests
        working-directory: app
        run: npm run test:unit

      - name: Install Linux native build deps
        # libportaudio2: sounddevice's runtime lib — without it
        # test_audio_gate/test_auto_stop_silence/test_recorder_device fail at
        # COLLECTION and abort the run (same fix as ci.yml).
        # libx11-dev & co: @electron/rebuild recompiles uiohook-napi against
        # Electron's ABI during `electron-builder`, and its X11 backend needs
        # these headers (X11/keysym.h etc.) — verified locally that this exact
        # set is what the AppImage build's native rebuild requires.
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxkbfile-dev libxrandr-dev

      - name: Run test suite
        run: python -m pytest -q tests

      # Runs electron-vite build + the PyInstaller backend bundle + electron-builder's
      # AppImage packaging in one step. Output lands in app/release/.
      - name: Build AppImage (electron-builder)
        working-directory: app
        run: npm run dist:linux

      - name: Locate AppImage artifact
        id: appimage
        run: |
          set -euo pipefail
          appimage="$(find app/release -maxdepth 1 -name '*.AppImage' | head -n1)"
          if [ -z "$appimage" ]; then
            echo "::error::No .AppImage found in app/release"
            exit 1
          fi
          chmod +x "$appimage"
          echo "Found AppImage: $appimage"
          echo "path=$appimage" >> "$GITHUB_OUTPUT"

      - name: Launch AppImage smoke check
        # AppImages run under FUSE by default; --appimage-extract-and-run avoids
        # needing FUSE on the runner. Xvfb supplies a display for Electron.
        env:
          BETTERFINGERS_AUTH_TOKEN: appimage-smoke-token
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            "${{ steps.appimage.outputs.path }}" --appimage-extract-and-run &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          # Match the packaged sidecar's 90s health budget, with a small
          # allowance for Electron process startup on a hosted runner.
          for attempt in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::AppImage exited before its bundled backend became healthy"
              exit 1
            fi
            if curl --silent --show-error --fail --max-time 2 \
              -H "Authorization: Bearer $BETTERFINGERS_AUTH_TOKEN" \
              http://127.0.0.1:8000/health; then
              echo
              echo "AppImage launched and its bundled backend answered /health; smoke check passed."
              exit 0
            fi
            sleep 1
          done
          echo "::error::AppImage stayed alive but bundled backend did not answer /health within 120s"
          exit 1

      - name: Generate and verify checksum
        run: |
          set -euo pipefail
          appimage="${{ steps.appimage.outputs.path }}"
          checksum="${appimage}.sha256"
          (cd "$(dirname "$appimage")" && \
            sha256sum "$(basename "$appimage")" > "$(basename "$checksum")" && \
            sha256sum --check "$(basename "$checksum")")

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ steps.appimage.outputs.path }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: BetterFingers-AppImage
          path: |
            ${{ steps.appimage.outputs.path }}
            ${{ steps.appimage.outputs.path }}.sha256
          if-no-files-found: error

  sbom:
    # Software Bill of Materials (CycloneDX) for release/tag builds. Syft scans
    # the checked-out source, capturing both the Python (requirements*) and npm
    # (app/package-lock.json) dependency trees. Runs on Linux for speed; the
    # SBOM is source/dependency based, not OS-specific. Uploaded as a build
    # artifact; on tag pushes, the publication job attaches it to the GitHub
    # Release with the platform artifacts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: betterfingers-sbom.cdx.json
          artifact-name: betterfingers-sbom.cdx.json

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-installer
      - linux-appimage
      - sbom
    runs-on: ubuntu-latest
    # The repository's `release` environment requires an explicit approval.
    # Manual branch dispatches never reach this job; tag builds wait here
    # after producing and validating all retained artifacts.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: BetterFingers-Installer
          path: release-assets/windows

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: BetterFingers-AppImage
          path: release-assets/linux

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: betterfingers-sbom.cdx.json
          path: release-assets/sbom

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows_installers=(release-assets/windows/*.exe)
          windows_checksums=(release-assets/windows/*.exe.sha256)
          windows_signatures=(release-assets/windows/*.exe.signature.txt)
          linux_images=(release-assets/linux/*.AppImage)
          linux_checksums=(release-assets/linux/*.AppImage.sha256)
          sboms=(release-assets/sbom/*.cdx.json)
          if [ "${#windows_installers[@]}" -ne 1 ] || [ "${#windows_checksums[@]}" -ne 1 ] || [ "${#windows_signatures[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows installer, checksum, and signature sidecar."
            find release-assets/windows -type f -print
            exit 1
          fi
          if [ "${#linux_images[@]}" -ne 1 ] || [ "${#linux_checksums[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux AppImage and checksum sidecar."
            find release-assets/linux -type f -print
            exit 1
          fi
          if [ "${#sboms[@]}" -ne 1 ]; then
            echo "Expected exactly one CycloneDX SBOM."
            find release-assets/sbom -type f -print
            exit 1
          fi
          (cd release-assets/windows && sha256sum --check *.exe.sha256)
          (cd release-assets/linux && sha256sum --check *.AppImage.sha256)

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: BetterFingers ${{ github.ref_name }}
          body: |
            BetterFingers ${{ github.ref_name }} is an unsigned public alpha for invited friend testing of local-first dictation on Windows and Linux.

            This is experimental software, not a broadly qualified stable release. The release contains a Windows NSIS installer, Linux AppImage, SHA-256 checksum sidecars, the Windows Authenticode status report, and a CycloneDX SBOM. The exact Windows signing mode for this tag is `${{ needs.windows-installer.outputs.signing_mode }}`. An unsigned Windows build can trigger Microsoft SmartScreen. Verify the SHA-256 sidecar before running it; do not disable Windows security controls.

            Speech-to-text requires a local Whisper model downloaded during setup. The separate multi-gigabyte language model used for AI cleanup is optional and disabled on a fresh install. Model downloads require network access. Do not use this alpha for highly sensitive dictation because production-grade at-rest encryption is not included.

            The tag workflow verifies installation, launch, authenticated local-backend health, a real pinned model download, upgrade continuity when a prior installer exists, and uninstall behavior. Friend testing is intended to find the remaining hardware, audio, injection, clipboard, and usability problems before signed release qualification. Report reproducible problems at https://github.com/RoyGSlade/BetterFingers/issues.
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/*.exe
            release-assets/windows/*.exe.sha256
            release-assets/windows/*.exe.signature.txt
            release-assets/linux/*.AppImage
            release-assets/linux/*.AppImage.sha256
            release-assets/sbom/*.cdx.json

      - name: Verify draft release download and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'BetterFingers-Setup-*-x64.exe' \
            --pattern 'BetterFingers-Setup-*-x64.exe.sha256' \
            --dir "$download_dir"
          installers=("$download_dir"/BetterFingers-Setup-*-x64.exe)
          checksums=("$download_dir"/BetterFingers-Setup-*-x64.exe.sha256)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            echo "Draft release did not serve exactly one Windows installer and checksum."
            find "$download_dir" -type f -print
            exit 1
          fi
          (cd "$download_dir" && sha256sum --check "$(basename "${checksums[0]}")")
          echo "Authenticated draft-release download and SHA-256 verification passed."
