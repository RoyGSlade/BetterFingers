# Project-scoped Codex configuration for BetterFingers.
#
# Codex only loads this file when the project is marked trusted (see the
# "Project config files" section of the Codex manual) — trust it once via
# the TUI, or `codex mcp list` / `/mcp` after starting Codex from the repo
# root to confirm the `collab` server is registered.
#
# This intentionally uses a repository-relative argument instead of a
# workstation-specific home path. Codex starts stdio MCP processes relative
# to its current working directory, so start Codex from the BetterFingers
# repository root; `cwd = "."` records that assumption explicitly. The
# repo-local server provides both the core claim/message lifecycle and the
# hierarchy tools described in `.claude/skills/hierarchy/SKILL.md`.

[mcp_servers.collab]
command = "python3"
args = [".claude/collab-mcp/server.py"]
cwd = "."
