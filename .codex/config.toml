# Project-scoped Codex configuration for BetterFingers.
#
# Codex only loads this file when the project is marked trusted (see the
# "Project config files" section of the Codex manual) — trust it once via
# the TUI, or `codex mcp list` / `/mcp` after starting Codex from the repo
# root to confirm the `collab` and `codex_director` servers are registered.
#
# This intentionally uses a repository-relative argument instead of a
# workstation-specific home path. Codex starts stdio MCP processes relative
# to its current working directory, so start Codex from the BetterFingers
# repository root; `cwd = "."` records that assumption explicitly. The
# repo-local collaboration server owns claims and cross-client messages. The
# separate Codex director server owns Codex process topology and lifecycle.
# Both use runtime state below the gitignored `.claude/collab/` tree.
[mcp_servers.collab]
command = "python3"
args = [".claude/collab-mcp/server.py"]
cwd = "."
required = true
env_vars = ["COLLAB_SESSION_ID", "COLLAB_WS_DIR", "COLLAB_ROOT_DIR", "COLLAB_PARENT_WS_DIR", "COLLAB_PARENT_NAME"]
enabled_tools = [
  "collab_register",
  "collab_status",
  "collab_claim",
  "collab_release",
  "collab_post",
  "collab_inbox",
  "collab_backlog",
  "collab_report_up",
  "collab_check_up",
  "collab_wait",
  "collab_workers",
  "collab_fleet",
]
default_tools_approval_mode = "approve"

[mcp_servers.codex_director]
command = "python3"
args = [".codex/director-mcp/server.py"]
cwd = "."
required = true
env_vars = [
  "CODEX_DIRECTOR_ROOT_DIR",
  "CODEX_DIRECTOR_ROLE",
  "CODEX_DIRECTOR_AGENT_ID",
  "CODEX_DIRECTOR_PARENT_ID",
  "CODEX_DIRECTOR_SESSION_ID",
  "CODEX_DIRECTOR_CLI",
  "CODEX_DIRECTOR_MAX_SUPERVISORS",
  "CODEX_DIRECTOR_MAX_WORKERS",
  "CODEX_DIRECTOR_HEALTHCHECK_S",
  "CODEX_DIRECTOR_SESSION_TIMEOUT_S",
  "CODEX_DIRECTOR_SUPERVISOR_MODEL",
  "CODEX_DIRECTOR_SUPERVISOR_EFFORT",
  "CODEX_DIRECTOR_WORKER_MODEL",
  "CODEX_DIRECTOR_WORKER_EFFORT",
]
default_tools_approval_mode = "approve"
