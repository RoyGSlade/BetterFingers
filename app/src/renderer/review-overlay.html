<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterFingers Review</title>
    <!-- Signal Desk design tokens + shared component classes (SPEC 2/7). See
         styles/signal-desk.css's "OVERLAYS" section for .sd-review-*, plus
         reused generics (.sd-badge, .sd-btn, .sd-btn-split, .sd-chip,
         .sd-confidence-bar, .sd-advanced, .sd-header__pill, .sd-actions-row)
         defined in the Talk/Library/Studio sections. -->
    <link rel="stylesheet" href="./styles/signal-desk.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--sd-bg-base);
        overflow: hidden;
      }

      button,
      textarea,
      select {
        font: inherit;
      }

      button,
      select {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div class="sd-review-shell">
      <header class="sd-review-header">
        <div class="sd-review-header__titles">
          <h1 class="sd-review-eyebrow"><span aria-hidden="true">✨</span> Review Deck</h1>
          <div id="status" class="sd-review-status" style="display:none;">Waiting for draft</div>
          <div class="sd-review-meta-row">
            <span id="statusBadge" class="status-badge state-pending">Draft Pending</span>
            <span id="ttsBackendBadge" class="tts-backend-badge">TTS: Loading...</span>
            <span id="commandBadge" class="status-badge command-badge" style="display:none;"></span>
          </div>
        </div>
        <div class="sd-review-header__right">
          <span class="sd-header__pill" aria-hidden="true">
            <span class="sd-header__pill-dot"></span>
            Signal Core
          </span>
          <button id="closeButton" class="sd-review-close" type="button" title="Close">✕</button>
        </div>
      </header>

      <main class="sd-review-main">
        <div>
          <textarea
            id="finalText"
            class="sd-review-hero-textarea"
            spellcheck="true"
            rows="2"
            placeholder="Cleaned output will appear here."
          ></textarea>
          <div id="draftSummary" class="draft-summary" aria-live="polite"></div>
        </div>

        <div id="rawSection" class="sd-review-raw-section">
          <button id="rawToggleButton" class="sd-review-raw-toggle" type="button" aria-expanded="true" aria-controls="rawBody">
            <span>Raw Transcript</span>
            <span class="sd-review-raw-toggle__chevron" aria-hidden="true">▲</span>
          </button>
          <div id="rawBody" class="sd-review-raw-body">
            <p id="rawText" class="raw">No transcript yet.</p>
            <div class="sd-review-audio-player" aria-hidden="true" title="Original recording (playback not yet available)">
              <span class="sd-review-audio-player__wave">
                <svg viewBox="0 0 72 18" preserveAspectRatio="none">
                  <path d="M1 9h2M6 5h2v8H6zM11 7h2v4h-2zM16 3h2v12h-2zM21 8h2v2h-2zM26 5h2v8h-2zM31 2h2v14h-2zM36 7h2v4h-2zM41 4h2v10h-2zM46 8h2v2h-2zM51 6h2v6h-2zM56 3h2v12h-2zM61 8h2v2h-2zM66 5h2v8h-2z" fill="currentColor"/>
                </svg>
              </span>
              <span id="rawDuration" class="sd-review-audio-player__duration">00:00</span>
              <span class="sd-review-audio-player__play">
                <svg viewBox="0 0 10 10"><path d="M1 0.5l8 4.5-8 4.5z" fill="currentColor"/></svg>
              </span>
            </div>
          </div>
        </div>

        <div class="sd-review-meta-strip">
          <div class="sd-review-meta-cell">
            <span class="sd-review-meta-cell__label">Destination</span>
            <span id="reviewDestinationValue" class="sd-review-meta-cell__value">Discord</span>
            <span id="reviewDestinationSub" class="sd-review-meta-cell__sub">#general</span>
          </div>
          <div class="sd-review-meta-cell">
            <span class="sd-review-meta-cell__label">Persona</span>
            <span id="reviewPersonaValue" class="sd-review-meta-cell__value">Natural</span>
            <span id="reviewPersonaSub" class="sd-review-meta-cell__sub">Conversational, clear, friendly</span>
          </div>
          <div class="sd-review-meta-cell sd-review-meta-cell--confidence">
            <span class="sd-review-meta-cell__label">Confidence</span>
            <span id="reviewConfidenceValue" class="sd-review-meta-cell__value">—</span>
            <div class="sd-confidence-bar"><div id="reviewConfidenceBarFill" class="sd-confidence-bar__fill" style="width: 0%;"></div></div>
          </div>
        </div>

        <!-- `open` by default: review-overlay.spec.js asserts #instructButton
             (inside this disclosure) is visible unconditionally, so this must
             not start collapsed -- see CURRENT_UI_INVENTORY.md §12.2's
             "instruct row" preservation requirement. -->
        <details class="sd-advanced" open>
          <summary>
            <span>Revise options</span>
            <span class="sd-advanced__chevron" aria-hidden="true">▾</span>
          </summary>
          <div class="sd-advanced__body">
            <div class="sd-review-secondary-row" style="display:flex; align-items:center; gap: var(--sd-space-8); flex-wrap: wrap;">
              <select id="rewritePreset" class="sd-review-select" aria-label="Rewrite style">
                <option value="clearer">Clearer</option>
                <option value="shorter">Shorter</option>
                <option value="tone">Tone</option>
              </select>
              <button id="instructButton" class="sd-btn" type="button">Instruct</button>
            </div>
            <div id="instructionRow" class="instruction-row hidden">
              <textarea id="instructionText" placeholder="Record or type what you want changed."></textarea>
              <button id="runInstructionButton" class="sd-btn" type="button">Rewrite</button>
            </div>
          </div>
        </details>
      </main>

      <footer class="sd-review-footer">
        <div class="sd-actions-row">
          <button id="readButton" class="sd-btn" type="button">Read</button>
          <button id="changeButton" class="sd-btn" type="button">Revise</button>
          <button id="cancelButton" class="sd-btn sd-review-cancel-btn" type="button">Cancel</button>
          <div class="sd-btn-split">
            <button id="acceptButton" class="sd-btn sd-btn--primary" type="button">
              <span aria-hidden="true">➤</span> Insert Message
            </button>
            <button id="acceptChevronButton" class="sd-btn-split__chevron" type="button" aria-label="Insert Message" tabindex="-1">▾</button>
          </div>
        </div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </footer>
    </div>

    <script type="module">
      // Expose the pure summary formatter to the classic script below. Module
      // scripts run before the load event but after the classic script's
      // synchronous body; renderDraft only runs on later IPC/user events, so the
      // global is always set by the time it is called.
      import { formatDraftSummary } from './lib/draftSummary.mjs';
      window.__formatDraftSummary = formatDraftSummary;
    </script>

    <!-- Module (not classic) so vite extracts it at build time — the CSP
         forbids inline script execution. Runs after the module above in
         document order, so window.__formatDraftSummary is already set. -->
    <script type="module">
      import {
        mapDraftStatusToOverlayState,
        overlayStateLabelFor,
        overlayStateDefaultTone,
        reviewReasonText,
        defaultSendActionFor,
        formatClockDuration,
      } from './lib/reviewOverlayStatus.mjs';
      // Reuses the SAME confidence->band/percent/CSS-var pure helpers the
      // Talk workspace's Refined Message card uses (SPEC 2's "color encodes
      // STATUS" rule), rather than re-deriving the mapping here.
      import { mapConfidenceBand, formatConfidencePercent, confidenceBandToCssVar } from './features/talkWorkspace.js';

      // Phase 3c: no token/origin in the renderer — backend calls go through
      // the main-process proxy. BACKEND_ORIGIN is only used to build/strip the
      // request path; the real origin lives in main.
      const BACKEND_ORIGIN = 'http://127.0.0.1:8000';
      function pathOf(url) {
        return String(url).startsWith(BACKEND_ORIGIN) ? String(url).slice(BACKEND_ORIGIN.length) : String(url);
      }
      const statusEl = document.getElementById('status');
      const rawTextEl = document.getElementById('rawText');
      const rawSectionEl = document.getElementById('rawSection');
      const rawToggleButton = document.getElementById('rawToggleButton');
      const rawDurationEl = document.getElementById('rawDuration');
      const finalTextEl = document.getElementById('finalText');
      const draftSummaryEl = document.getElementById('draftSummary');
      const messageEl = document.getElementById('message');
      const reviewDestinationValueEl = document.getElementById('reviewDestinationValue');
      const reviewDestinationSubEl = document.getElementById('reviewDestinationSub');
      const reviewPersonaValueEl = document.getElementById('reviewPersonaValue');
      const reviewPersonaSubEl = document.getElementById('reviewPersonaSub');
      const reviewConfidenceValueEl = document.getElementById('reviewConfidenceValue');
      const reviewConfidenceBarFillEl = document.getElementById('reviewConfidenceBarFill');

      // Draft word/length summary (Phase 8). Computed live from the textarea so
      // the count stays accurate while the user edits. Falls back to a bare word
      // count if the module helper somehow has not loaded yet.
      function updateDraftSummary() {
        if (!draftSummaryEl) return;
        const text = finalTextEl?.value || '';
        const limit = currentDraft?.token_limit;
        if (typeof window.__formatDraftSummary === 'function') {
          draftSummaryEl.textContent = window.__formatDraftSummary(text, limit);
        } else {
          const words = text.trim() ? text.trim().split(/\s+/).length : 0;
          draftSummaryEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
        }
      }
      finalTextEl?.addEventListener('input', updateDraftSummary);
      const instructionRow = document.getElementById('instructionRow');
      const instructionTextEl = document.getElementById('instructionText');
      const acceptButton = document.getElementById('acceptButton');
      const acceptChevronButton = document.getElementById('acceptChevronButton');
      const changeButton = document.getElementById('changeButton');
      const rewritePresetEl = document.getElementById('rewritePreset');
      const instructButton = document.getElementById('instructButton');
      const runInstructionButton = document.getElementById('runInstructionButton');
      const readButton = document.getElementById('readButton');
      const cancelButton = document.getElementById('cancelButton');
      const closeButton = document.getElementById('closeButton');

      let currentDraft = null;
      let outputSettings = null;
      let currentState = 'pending';

      function setMessage(text = '', tone = '') {
        messageEl.textContent = text;
        if (tone) {
          messageEl.dataset.tone = tone;
        } else {
          delete messageEl.dataset.tone;
        }
      }

      function setOverlayState(state, customMessage = '', tone = '') {
        currentState = state;
        const statusBadge = document.getElementById('statusBadge');
        if (!statusBadge) return;

        statusBadge.className = `status-badge state-${state}`;
        statusBadge.textContent = overlayStateLabelFor(state);

        // Update Read button text/styling based on speaking state. Text stays
        // literally "Read"/"Stop" (not "Listen") -- review-overlay.spec.js
        // asserts on those exact words.
        if (state === 'speaking') {
          readButton.textContent = 'Stop';
          readButton.classList.add('is-speaking');
        } else {
          readButton.textContent = 'Read';
          readButton.classList.remove('is-speaking');
        }

        if (customMessage) {
          const messageTone = tone || overlayStateDefaultTone(state);
          setMessage(customMessage, messageTone);
        }
      }

      async function updateTtsStatusBadge() {
        const ttsBadge = document.getElementById('ttsBackendBadge');
        if (!ttsBadge) return;
        try {
          const status = await fetchJson(`${BACKEND_ORIGIN}/runtime/tts-status`, {}, 5000);
          if (status.ok) {
            ttsBadge.textContent = `TTS: ${status.backend}`;
            ttsBadge.className = 'tts-backend-badge success';
            ttsBadge.title = status.message || '';
          } else {
            // TTS (read-aloud) is an optional feature — an unavailable backend is
            // a warning, not a critical red error. Reserve danger for a genuine
            // hard failure like a missing libsndfile dependency.
            const hardError = Boolean(status.libsndfile_missing);
            ttsBadge.textContent = `TTS: ${status.backend}`;
            ttsBadge.className = `tts-backend-badge ${hardError ? 'danger' : 'warning'}`;
            ttsBadge.title = status.message || '';
            if (hardError) {
              setOverlayState('error', status.message);
            }
          }
        } catch (error) {
          ttsBadge.textContent = 'TTS: unavailable';
          ttsBadge.className = 'tts-backend-badge warning';
          ttsBadge.title = `Failed to fetch TTS status: ${error.message}`;
        }
      }

      let commandBadgeTimer = null;

      function showCommandBadge(label) {
        const commandBadge = document.getElementById('commandBadge');
        if (!commandBadge || !label) return;
        commandBadge.textContent = `Command: ${label}`;
        commandBadge.style.display = 'inline-block';
        clearTimeout(commandBadgeTimer);
        commandBadgeTimer = setTimeout(() => {
          commandBadge.style.display = 'none';
        }, 3000);
      }

      function stopTtsIfSpeaking() {
        if (currentState === 'speaking') {
          postJson(`${BACKEND_ORIGIN}/tts/stop`, {}, 2000).catch(() => {});
          setOverlayState('pending');
        }
      }

      async function proxyReq(method, url, body, timeoutMs = 120000) {
        const bridge = window.betterFingers && window.betterFingers.backendRequest;
        if (typeof bridge !== 'function') {
          throw new Error('Backend bridge is unavailable.');
        }
        const res = await bridge(method, pathOf(url), body, timeoutMs);
        if (!res) {
          throw new Error('Backend request returned no result.');
        }
        if (res.status === 0 && res.ok === false) {
          if (res.error === 'timeout') {
            throw new Error(`Request timed out after ${Math.round(timeoutMs / 1000)} seconds.`);
          }
          throw new Error(res.error || 'Backend request failed.');
        }
        if (!res.ok) {
          const detail = res.body && (res.body.detail || res.body.message || res.body.error);
          throw new Error(detail ? String(detail) : `${url} failed with status ${res.status}`);
        }
        return res.body;
      }

      async function fetchJson(url, options = {}, timeoutMs = 120000) {
        // The review overlay only ever GETs through this helper.
        return proxyReq('GET', url, undefined, timeoutMs);
      }

      function postJson(url, payload = {}, timeoutMs = 120000) {
        return proxyReq('POST', url, payload, timeoutMs);
      }

      async function sendDraftTyped(id, action, timeoutMs = 120000) {
        // Draft send is a typed IPC method (exact route + validated payload);
        // the generic proxy refuses /drafts/:id/send.
        const bridge = window.betterFingers && window.betterFingers.sendDraft;
        if (typeof bridge !== 'function') {
          throw new Error('Backend bridge is unavailable.');
        }
        const res = await bridge(Number(id), { action, openChat: action === 'open_chat_then_send' }, timeoutMs);
        if (!res) {
          throw new Error('Backend request returned no result.');
        }
        if (res.status === 0 && res.ok === false) {
          if (res.error === 'timeout') {
            throw new Error(`Request timed out after ${Math.round(timeoutMs / 1000)} seconds.`);
          }
          throw new Error(res.error || 'Backend request failed.');
        }
        if (!res.ok) {
          const detail = res.body && (res.body.detail || res.body.message || res.body.error);
          throw new Error(detail ? String(detail) : `Draft send failed with status ${res.status}`);
        }
        return res.body;
      }

      function defaultSendAction() {
        return defaultSendActionFor(outputSettings);
      }

      async function refreshOutputSettings() {
        outputSettings = await fetchJson(`${BACKEND_ORIGIN}/runtime/output-settings`, {}, 4000);
        return outputSettings;
      }

      // DESTINATION / PERSONA / CONFIDENCE meta strip (SPEC 7). Confidence is
      // real data (draft.confidence.score, same field Talk's Refined Message
      // card reads). Persona/destination fields don't exist on draft objects
      // yet (see talkWorkspace.js's identical TODO(phase-integration) note) --
      // forward-compat field probe; when absent, the placeholder already in
      // the markup is left alone rather than blanked.
      function renderMetaStrip(draft) {
        const personaName = draft?.persona_name || draft?.persona?.name;
        if (personaName && reviewPersonaValueEl) reviewPersonaValueEl.textContent = personaName;
        const personaDesc = draft?.persona_description || draft?.persona?.description;
        if (personaDesc && reviewPersonaSubEl) reviewPersonaSubEl.textContent = personaDesc;

        const destinationName = draft?.destination_name || draft?.destination?.name;
        if (destinationName && reviewDestinationValueEl) reviewDestinationValueEl.textContent = destinationName;
        const destinationSub = draft?.destination_channel || draft?.destination?.channel;
        if (destinationSub && reviewDestinationSubEl) reviewDestinationSubEl.textContent = destinationSub;

        const score = draft?.confidence?.score;
        const pct = formatConfidencePercent(score);
        const band = pct === null ? null : mapConfidenceBand(score, draft?.status);
        if (reviewConfidenceValueEl) reviewConfidenceValueEl.textContent = pct === null ? '—' : `${pct}%`;
        if (reviewConfidenceBarFillEl) {
          reviewConfidenceBarFillEl.style.width = pct === null ? '0%' : `${pct}%`;
          const cssVar = confidenceBandToCssVar(band || 'high');
          reviewConfidenceBarFillEl.style.setProperty('--sd-confidence-color', cssVar);
          reviewConfidenceValueEl?.style?.setProperty('--sd-confidence-color', cssVar);
        }

        if (rawDurationEl) {
          rawDurationEl.textContent = formatClockDuration(draft?.metadata?.duration_seconds);
        }
      }

      function renderDraft(draft) {
        currentDraft = draft;
        const status = draft?.status || 'pending';
        statusEl.textContent = draft?.id ? `Draft #${draft.id}` : 'Waiting for draft';
        rawTextEl.textContent = draft?.raw_text || 'No transcript yet.';
        finalTextEl.value = draft?.final_text || '';
        updateDraftSummary();
        renderMetaStrip(draft);

        let targetState = mapDraftStatusToOverlayState(status);
        if (targetState === 'sent' && draft?.send_result?.fallback) {
          targetState = 'copied';
        }
        setOverlayState(targetState);

        if (draft?.error) {
          setMessage(draft.error, 'danger');
        } else {
          setMessage('');
        }
      }

      async function saveEdit() {
        if (!currentDraft?.id) return currentDraft;
        const nextText = finalTextEl.value || '';
        if (nextText === (currentDraft.final_text || '')) {
          return currentDraft;
        }
        currentDraft = await postJson(`${BACKEND_ORIGIN}/drafts/${currentDraft.id}/edit`, { final_text: nextText }, 10000);
        return currentDraft;
      }

      function setBusy(isBusy) {
        for (const button of [acceptButton, changeButton, rewritePresetEl, instructButton, runInstructionButton, cancelButton]) {
          button.disabled = isBusy;
        }
      }

      async function acceptDraft() {
        if (!currentDraft?.id) return;
        stopTtsIfSpeaking();
        setBusy(true);
        setOverlayState('accepted', 'Accepting...');
        try {
          await refreshOutputSettings();
          await saveEdit();
          const withheldForReview = currentDraft?.auto_send_ok === false;
          currentDraft = await postJson(`${BACKEND_ORIGIN}/drafts/${currentDraft.id}/accept`, {}, 10000);
          // Only auto-send when the profile is in auto_send mode AND the policy
          // did not withhold this draft (low/missing confidence, long, or gated).
          if (outputSettings?.send_mode === 'auto_send' && currentDraft?.auto_send_ok !== false) {
            const action = defaultSendAction();
            const sentDraft = await sendDraftTyped(currentDraft.id, action, 120000);
            renderDraft(sentDraft);

            const isFallback = Boolean(sentDraft.send_result?.fallback);
            if (sentDraft.send_result?.ok) {
              setOverlayState(isFallback ? 'copied' : 'sent', sentDraft.send_result?.message || 'Sent.');
              setTimeout(() => window.betterFingersReview?.hide?.(), 1200);
            } else {
              setOverlayState('error', sentDraft.send_result?.message || 'Send failed.');
            }
          } else {
            renderDraft(currentDraft);
            if (withheldForReview && outputSettings?.send_mode === 'auto_send') {
              const reason = reviewReasonText(currentDraft?.force_review_reason);
              setOverlayState(
                'accepted',
                `Review required${reason ? ` (${reason})` : ''}. Press the primary action hotkey to send.`,
              );
            } else {
              setOverlayState('accepted', 'Accepted. Press the primary action hotkey to send.');
            }
          }
        } catch (error) {
          setOverlayState('error', `Accept failed: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function rewriteDraft(action, customInstruction = '') {
        if (!currentDraft?.id) return;
        stopTtsIfSpeaking();
        setBusy(true);
        setOverlayState('rewriting', 'Rewriting...');
        try {
          await saveEdit();
          const rewritten = await postJson(
            `${BACKEND_ORIGIN}/drafts/${currentDraft.id}/rewrite`,
            { action, custom_instruction: customInstruction },
            120000,
          );
          if (rewritten?.ok === false) {
            setOverlayState('error', `Rewrite failed: ${rewritten.error || 'Unknown error'}`);
            return;
          }
          renderDraft(rewritten);
          setOverlayState('rewritten', 'Rewrite ready.');
        } catch (error) {
          setOverlayState('error', `Rewrite failed: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function declineDraft() {
        stopTtsIfSpeaking();
        if (!currentDraft?.id) {
          window.betterFingersReview?.hide?.();
          return;
        }
        setBusy(true);
        setOverlayState('declined', 'Cancelling...');
        try {
          await postJson(`${BACKEND_ORIGIN}/drafts/${currentDraft.id}/decline`, {}, 10000);
          window.betterFingersReview?.hide?.();
        } catch (error) {
          setOverlayState('error', `Cancel failed: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function readDraft() {
        if (!currentDraft?.id) return;
        try {
          await saveEdit();
          const voiceId = outputSettings?.review_tts_voice_hint || 'standard_female';
          const speed = parseFloat(outputSettings?.review_tts_speed || '1.0');

          setOverlayState('speaking', 'Speaking...');

          const result = await postJson(`${BACKEND_ORIGIN}/drafts/${currentDraft.id}/tts`, {
            text: finalTextEl.value,
            voice_id: voiceId,
            speed: speed
          }, 120000);

          if (result?.ok === false) {
            setOverlayState('error', result?.message || 'Read failed.');
          }
        } catch (error) {
          setOverlayState('error', `Read failed: ${error.message}`);
        }
      }

      window.betterFingersReview?.onDraft((draft) => {
        renderDraft(draft);
        refreshOutputSettings().catch(() => {});
        updateTtsStatusBadge().catch(() => {});
        // Move focus into the overlay so keyboard users land somewhere useful.
        if (!acceptButton.disabled) {
          acceptButton.focus();
        }
      });

      window.betterFingersReview?.onStatus((statusUpdate) => {
        const status = statusUpdate?.status;
        if (status === 'draft_tts_started') {
          setOverlayState('speaking', 'Speaking...');
        } else if (status === 'draft_tts_stopped') {
          if (currentState === 'speaking') {
            setOverlayState('pending', 'TTS playback completed.');
          }
        } else if (status === 'emergency_stop') {
          setOverlayState('stopped', statusUpdate?.message || 'Emergency stopped.');
        } else if (status === 'draft_sent') {
          const isFallback = Boolean(statusUpdate?.send_result?.fallback);
          setOverlayState(isFallback ? 'copied' : 'sent', statusUpdate?.send_result?.message || 'Sent.');
          setTimeout(() => window.betterFingersReview?.hide?.(), 1200);
        } else if (status === 'draft_send_error') {
          setOverlayState('error', statusUpdate?.error || 'Send failed.');
        } else if (status === 'command_detected') {
          showCommandBadge(statusUpdate?.action || statusUpdate?.label || 'unknown');
        } else if (status === 'command_needs_confirmation') {
          showCommandBadge(statusUpdate?.action || statusUpdate?.label || 'unknown');
          setOverlayState('confirm', 'Say "confirm" or "cancel".', 'warning');
        } else if (status === 'scratch_last') {
          setMessage(
            statusUpdate?.scratched_text ? `Scratched: "${statusUpdate.scratched_text}"` : 'Scratched last utterance.',
            'warning',
          );
        }
      });

      acceptButton.addEventListener('click', acceptDraft);
      // Decorative split-button chevron (SPEC 7's "Insert Message" green
      // split-button) -- no send-variant picker exists yet (unlike Talk's
      // Send/Insert/Copy segmented control), so the chevron just re-triggers
      // the same accept action rather than being a dead click target.
      acceptChevronButton.addEventListener('click', acceptDraft);
      changeButton.addEventListener('click', () => rewriteDraft(rewritePresetEl?.value || 'clearer'));
      instructButton.addEventListener('click', () => {
        instructionRow.classList.toggle('hidden');
        if (!instructionRow.classList.contains('hidden')) {
          instructionTextEl.focus();
        }
      });
      runInstructionButton.addEventListener('click', () => {
        const instruction = instructionTextEl.value.trim();
        if (!instruction) {
          setMessage('Add an instruction first.', 'warning');
          return;
        }
        rewriteDraft('custom', instruction);
      });
      readButton.addEventListener('click', async () => {
        if (currentState === 'speaking') {
          try {
            await postJson(`${BACKEND_ORIGIN}/tts/stop`, {}, 5000);
          } catch (error) {
            setOverlayState('error', `Failed to stop TTS: ${error.message}`);
          }
        } else {
          await readDraft();
        }
      });
      cancelButton.addEventListener('click', declineDraft);
      closeButton.addEventListener('click', () => {
        stopTtsIfSpeaking();
        window.betterFingersReview?.hide?.();
      });

      // Raw Transcript collapse toggle (SPEC 7: "RAW TRANSCRIPT (collapsible
      // ▲)") -- presentation-only progressive disclosure; #rawText's content
      // and update logic are unchanged, this only shows/hides it. Starts
      // expanded (matching the original always-visible behavior).
      rawToggleButton.addEventListener('click', () => {
        const collapsed = rawSectionEl.classList.toggle('is-collapsed');
        rawToggleButton.setAttribute('aria-expanded', String(!collapsed));
      });

      // Escape dismisses the review overlay (non-destructive: hides, doesn't decline).
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          stopTtsIfSpeaking();
          window.betterFingersReview?.hide?.();
        }
      });

      refreshOutputSettings().catch(() => {});
      updateTtsStatusBadge().catch(() => {});
    </script>
  </body>
</html>
