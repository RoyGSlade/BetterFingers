<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>BetterFingers Overlay</title>
    <!-- Signal Desk design tokens + shared component classes (SPEC 2/7). See
         styles/signal-desk.css's "OVERLAYS" section for .sd-capture-*. -->
    <link rel="stylesheet" href="./styles/signal-desk.css" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
        font-family: var(--sd-font-family);
        user-select: none;
      }
      /* Just the Signal Core ring (its "background" is drawn in-canvas, not a
         box) plus an optional glass status pill. The whole window is the drag
         handle. Window pixel bounds are set by windows.js's
         overlayWindowSize() -- see signal-desk.css's OVERLAYS section header
         comment for why this stays compact rather than mockup 04's full
         capture-overlay composition. */
      .sd-capture-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100vw;
        height: 100vh;
        -webkit-app-region: drag;
      }
      .sd-capture-wrap.pos-beside { flex-direction: row; }
      .sd-capture-wrap.pos-above { flex-direction: column-reverse; gap: 2px; }
      .sd-capture-wrap.pos-below { flex-direction: column; gap: 2px; }
      /* "Across the centre" -- overlay the label on top of the ring's middle. */
      .sd-capture-wrap.pos-center .sd-capture-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="sd-capture-wrap" id="overlayWrap">
      <canvas id="statusRing" class="sd-capture-ring" width="70" height="70" style="width: 70px; height: 70px;"></canvas>
      <div id="statusText" class="sd-capture-label hidden" data-ring-state="idle">Press Alt + Space to capture</div>
    </div>

    <script type="module">
      import { createSignalCore } from './signalCore.js';
      import { interpretOverlayStatus } from './lib/overlayStatus.mjs';

      const wrap = document.getElementById('overlayWrap');
      const canvas = document.getElementById('statusRing');
      const textEl = document.getElementById('statusText');

      // Signal Core is the Signal Desk's canonical HUD ring (cyan/teal
      // segmented arcs -- SPEC 4/7), reused here instead of glitch-ring.js so
      // the capture overlay shares the exact same ring identity as the Talk
      // workspace's hero ring. Segment/particle counts are turned down from
      // signalCore.js's ~520px-hero defaults since this window is only
      // 46-150px (see windows.js's OVERLAY_SIZE_PX) -- fewer, thicker
      // segments read more clearly at that size. Every ratio-based number
      // (radii, line widths) is already resolution-independent and needs no
      // tuning; only the raw segment/particle COUNTS benefit from it.
      const COMPACT_RING_OPTIONS = {
        segmentedRings: [
          { segmentCount: 28 },
          { segmentCount: 20 },
          { segmentCount: 14 },
        ],
        particles: { count: 10 },
      };
      const ring = createSignalCore({ canvas, state: 'idle', options: COMPACT_RING_OPTIONS });

      const SIZE_PX = { small: 46, medium: 70, large: 108, xlarge: 150 };
      const POSITIONS = new Set(['beside', 'above', 'below', 'center']);

      // Apply the user's overlay appearance (ring size, vibrancy, label
      // position). Window geometry (placement/opacity/bounds) is handled by
      // the main process. signalCore.js has no setCompact()/setVibrancy()
      // (glitch-ring.js's API) -- vibrancy is approximated with a CSS
      // brightness filter on the canvas instead, which is visually
      // equivalent for this "dimmer/hotter" setting.
      function applyAppearance(a) {
        const px = SIZE_PX[a?.size] || SIZE_PX.medium;
        canvas.style.width = px + 'px';
        canvas.style.height = px + 'px';
        const vibrancy = typeof a?.vibrancy === 'number' ? Math.max(0.3, Math.min(2, a.vibrancy)) : 1;
        canvas.style.filter = vibrancy === 1 ? '' : `brightness(${vibrancy})`;
        const pos = POSITIONS.has(a?.labelPos) ? a.labelPos : 'hidden';
        wrap.className = 'sd-capture-wrap' + (pos !== 'hidden' ? ' pos-' + pos : '');
        textEl.classList.toggle('hidden', pos === 'hidden');
      }

      window.betterFingersOverlay?.onStatusUpdate((update) => {
        const payload = typeof update === 'string' ? { status: update } : (update || {});
        const status = payload.status || 'unknown';
        const { ring: ringState, text: label } = interpretOverlayStatus(status, payload);
        ring.setState(ringState);
        // Presentation-only hook: colors the label pill (and its dot) per
        // ring state via signal-desk.css's [data-ring-state] rules. Does not
        // affect the ring itself or any IPC/backend behavior.
        textEl.dataset.ringState = ringState;
        textEl.textContent = label;
        // Live mic RMS (when the backend includes it) pulses the ring + wave.
        if (status === 'recording' && typeof payload.amplitude === 'number') {
          ring.setAmplitude(payload.amplitude);
        } else {
          ring.setAmplitude(null);
        }
      });

      // Appearance pushed by the main process on load and whenever settings change.
      window.betterFingersOverlay?.onAppearance?.((a) => applyAppearance(a));

      // The window is click-through by default (see windows.js) so it never
      // steals clicks meant for whatever's underneath it. While the cursor is
      // over the visible ring/label, temporarily make the window hit-testable
      // again so it can still be dragged to reposition.
      wrap.addEventListener('mouseenter', () => {
        window.betterFingersOverlay?.setIgnoreMouseEvents?.(false);
      });
      wrap.addEventListener('mouseleave', () => {
        window.betterFingersOverlay?.setIgnoreMouseEvents?.(true);
      });
    </script>
  </body>
</html>
